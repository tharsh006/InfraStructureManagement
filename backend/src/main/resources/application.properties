spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/infrapilot}
spring.datasource.username=${DB_USERNAME:infrauser}
spring.datasource.password=${DB_PASSWORD:local-dev-password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true