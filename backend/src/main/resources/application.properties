spring.application.name=InfraManagement

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/inframanagement}
spring.datasource.username=${DB_USERNAME:infrauser}
spring.datasource.password=${DB_PASSWORD:local-dev-password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

info.app.name=InfraManagement
info.app.description=Infrastructure Management Platform
info.app.version=0.0.1